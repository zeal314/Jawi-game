name: Jawi

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Muat turun kod
      uses: actions/checkout@v4

    - name: Sediakan Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Beri kebenaran Gradle
      run: chmod +x gradlew

    - name: Bina Debug APK
      run: ./gradlew assembleDebug

    - name: Muat naik hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Saya-APK
        path: app/build/outputs/apk/debug/app-debug.apk
